[package]
name = "mm-core"
version = "0.1.0"
description = "The parts of Dota 2 Mod Manager that read and write the game's files, in Rust"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
crc32fast.workspace = true
indexmap = { version = "2", features = ["serde"] }
sha1 = "0.10"
memchr = "2"
rustc-hash = "2"
rayon = "1"
regex = "1"
ruzstd = "0.9.1"
# sin and cos as fdlibm computes them, which is what V8 does: the 3D preview reads the same numbers
libm = "0.2"
# String.prototype.localeCompare: the root collation of ICU, which V8 sorts names by
icu_collator = "2"
uuid = { version = "1", features = ["v4"] }
# foreign archives: mods, fonts, cursors and tools off the catalog, presets off Discord
zip = { version = "2", default-features = false, features = ["deflate"] }
# free space on the drive a mod is about to be written to
fs4 = "0.13"
# local time for a zip's dates, and the ISO time in the ownership note
# preset links: raw deflate and base64url, as node:zlib and Buffer make them
flate2 = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
