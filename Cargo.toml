# The Rust half of the app: the Tauri shell and the crates it is built from.
# docs/rust-migration.md says what has moved here from src/ and what has not yet.
[workspace]
resolver = "2"
members = ["src-tauri", "crates/*"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/dota2modmanager/dota2-mod-manager"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
base64 = "0.22"
thiserror = "2"
crc32fast = "1"
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
mm-core = { path = "crates/mm-core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "unwind"

# the hot loops (VPK, KeyValues, hashing) are worth optimising even in a debug build
[profile.dev.package."*"]
opt-level = 2
