# Does this thing work on Linux at all?
#
# Dota has a native Linux build, the mods are the same files in the same folders, and the only
# Windows-shaped parts of the app were finding Steam and asking whether the game is running.
# Both now have a Linux branch, and a branch nobody runs is a branch that rots, so this builds
# the AppImage (the Tauri shell, src-tauri/) and starts it against the sandbox on every change to
# the code.
#
# Nothing here is published. The release still ships Windows only, because "supported" means
# somebody has run it on a real desktop, and the artifacts below are how that person gets a
# build to try without installing a toolchain.
name: Linux

on:
  push:
    branches: [main]
    paths:
      - 'preload.js'
      - 'renderer/**'
      - 'crates/**'
      - 'src-tauri/**'
      - 'Cargo.lock'
      - 'tools/sandbox.js'
      - 'package.json'
      - '.github/workflows/linux.yml'
  pull_request:
  # No paths filter exists for merge_group, so every change the queue lands is built and started.
  merge_group:
  workflow_dispatch:

# The token reads the repository and nothing more. A job that needs more asks for it itself.
permissions:
  contents: read


jobs:
  build:
    name: Build the AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # the runner image carries rustup; stable is whatever it names today
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # What Tauri needs to build on Linux (WebKitGTK, the tray, icons, patchelf for the bundle),
      # and xvfb, xdg-utils and desktop-file-utils for the first start below. apt drops a silent
      # mirror after 30 s and tries another, and the step gives up at ten minutes.
      - name: System libraries
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb xdg-utils desktop-file-utils

      # Not published: this proves the build works. release.yml builds the one people download.
      # the target folder from the last build on main: a pull request rebuilds only what it changed
      # instead of every crate from scratch. Saved from main alone, read everywhere else.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: npx tauri build --bundles appimage

      # A runner has no FUSE to mount an AppImage with, so it is unpacked. AppRun is the program
      # the AppImage would have started.
      - name: Unpack it
        run: |
          set -euo pipefail
          img=$(ls target/release/bundle/appimage/*.AppImage | head -1)
          ls -l "$img"
          chmod +x "$img"
          "$img" --appimage-extract > /dev/null
          ls squashfs-root

      # The .desktop file inside the AppImage is what an AppImage integrator reads, and it has to
      # name the preset file type (tauri.conf.json fileAssociations).
      - name: The bundled desktop entry claims the preset file type
        run: |
          set -euo pipefail
          entry=$(ls squashfs-root/*.desktop | head -1)
          cat "$entry"
          grep -q 'application/x-d2mm' "$entry"

      # The scheme is claimed by the app itself: on its first start it writes its own entry to
      # ~/.local/share/applications and has the desktop database rebuilt
      # (crates/mm-core/src/catalog/deep_links.rs install_desktop_entry). Started once here from
      # the unpacked image, it has to leave xdg-mime naming it for both types (#229). This shows
      # the registration, not a browser handing a link over: a runner has no browser session.
      - name: After one start, xdg-mime names the app for d2mm links and presets
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # an empty home, so nothing a runner image already holds can answer for us
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          xvfb-run -a squashfs-root/AppRun > first-start.log 2>&1 &
          pid=$!
          for _ in $(seq 1 60); do
            [ -f "$HOME/.local/share/applications/dota2-mod-manager.desktop" ] && break
            sleep 1
          done
          sleep 3
          kill "$pid" 2>/dev/null || true
          ls -la "$HOME/.local/share/applications" || { cat first-start.log; exit 1; }
          fail=0
          for type in x-scheme-handler/d2mm application/x-d2mm; do
            got=$(xdg-mime query default "$type" || true)
            echo "$type -> ${got:-nothing}"
            [ "$got" = "dota2-mod-manager.desktop" ] || fail=1
          done
          if [ "$fail" = 1 ]; then
            cat "$HOME/.config/mimeapps.list" 2>/dev/null || true
            cat "$HOME/.local/share/applications/mimeinfo.cache" 2>/dev/null || true
            cat first-start.log
            echo "::error::xdg-mime does not name dota2-mod-manager.desktop for both types"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: AppImage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  start:
    name: Start it against the sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # WebKitGTK and the tray library the shell links against, and an X server for a window
      - name: System libraries
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb

      # a debug build of the same shell: quicker than the AppImage, and the job above checks that
      # the target folder from the last build on main: a pull request rebuilds only what it changed
      # instead of every crate from scratch. Saved from main alone, read everywhere else.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: The page and the shell
        run: node tools/ui-build.mjs --tauri && cargo build -p dota2-mod-manager

      # The tree only: the mods themselves are a few hundred megabytes and prove nothing about
      # whether the app starts.
      - name: Seed the sandbox
        run: node tools/sandbox.js seed --no-mods

      # MM_SHOT is the app's own harness (src-tauri/src/harness.rs): once the page has loaded it
      # runs MM_EVAL there and writes the answer beside the name, or what went wrong. The run is
      # held to the sandbox (--write-jail), the only kind of run the harness answers.
      - name: Start the app and ask the window what it shows
        env:
          MM_EVAL: '({ title: document.title, buttons: document.querySelectorAll("button").length })'
        run: |
          set -euo pipefail
          MM_SHOT="$PWD/linux-start.png" xvfb-run -a target/debug/dota2-mod-manager \
            --user-data-dir=sandbox/userdata --write-jail=sandbox > app.log 2>&1 &
          pid=$!
          for _ in $(seq 1 90); do
            if [ -s linux-start.png.eval.json ] || [ -s linux-start.png.err.txt ]; then break; fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          if [ ! -s linux-start.png.eval.json ]; then
            echo "the window never answered:"
            cat linux-start.png.err.txt 2>/dev/null || true
            cat app.log
            exit 1
          fi
          cat linux-start.png.eval.json

      # A window can appear with the code behind it already broken. These three phrases are what
      # a name that does not exist looks like by the time it reaches the log. Two releases in
      # September shipped exactly this shape of failure.
      - name: Read the log for code that could not run
        run: |
          set -euo pipefail
          log=sandbox/userdata/logs/app.log
          [ -f "$log" ] || { echo "no app log was written"; exit 0; }
          if grep -nE "unhandledrejection|is not defined|is not a function" "$log"; then
            echo "::error::the app logged a name it could not resolve while starting"
            exit 1
          fi
          echo "the log has no unresolved names in it"

      - name: What it answered
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: first-window
          path: |
            linux-start.png.eval.json
            linux-start.png.err.txt
            app.log
            sandbox/userdata/logs/
          if-no-files-found: warn
