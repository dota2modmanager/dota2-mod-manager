# The mutants, run once a week and whenever the mutants themselves change.
#
# A mutation run costs a suite run per mutant, which is why it is in neither `npm run verify` nor
# the required checks. test/mutate.test.js already holds every mutant against the source on every
# push, so a mutant cannot quietly stop applying. This is the other half: asking whether the tests
# would still notice each promise being broken. A red run here is a test that has stopped proving
# something, and the radar reports a scheduled workflow that is red or has gone quiet.
#
# It also runs on a pull request that touches the mutants, the tool or this file, because a
# workflow that only runs on a schedule cannot be tried before it is merged, and some tests are
# skipped on Linux: a mutant only a Windows test catches would survive here and turn this red a
# week later instead of in the pull request that added it.
name: Mutants

on:
  schedule:
    - cron: '41 2 * * 3'   # Wednesdays, 02:41 UTC, away from the Monday jobs
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/mutation.yml'
      - '.github/mutants.json'
      - 'tools/mutate.mjs'

permissions:
  contents: read

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Break each promise and check a test notices
        run: npm run mutate
