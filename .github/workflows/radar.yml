name: Radar

# Once a day, everything that is waiting on a person, in one pinned issue called "Project status".
#
# Pull requests and issues nobody has answered, open code scanning alerts, known vulnerabilities in
# what the app and the site install (npm audit, from the lockfiles), workflows that are red or
# have gone quiet, secrets about to expire, a weekly report that did not arrive. The issue body is
# rewritten each run rather than commented on, so it always reads as today and never piles up.
# When something has waited longer than CONTRIBUTING.md and SECURITY.md promise, the maintainer
# gets one Discord message in a private channel. tools/radar.mjs says why this exists.

on:
  schedule:
    - cron: '30 6 * * *'   # every day, 06:30 UTC
  workflow_dispatch:
    inputs:
      dry:
        description: 'Print the issue body and the Discord message, change nothing'
        type: boolean
        default: false

# The token reads the repository and nothing more. The job below asks for what it reports on.
permissions:
  contents: read

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Read everything it reports on, write one issue. Nothing here pushes, labels or closes.
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      # Every secret the workflows use, tried against the service it belongs to: does it still
      # work, and when does it stop. The results go to credentials-status.json for the next step,
      # without a single value in them. tools/check-credentials.mjs says why this exists.
      - name: Check that every secret still works
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MIRROR_PUSH_URL: ${{ secrets.MIRROR_PUSH_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RADAR_DISCORD_WEBHOOK: ${{ secrets.RADAR_DISCORD_WEBHOOK }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
          FINGERPRINTS_DEPLOY_KEY: ${{ secrets.FINGERPRINTS_DEPLOY_KEY }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: node tools/check-credentials.mjs

      # The webhook address is a credential. The script never prints it, including in an error.
      - name: Look at everything that waits on a person
        env:
          GH_TOKEN: ${{ github.token }}
          RADAR_DISCORD_WEBHOOK: ${{ secrets.RADAR_DISCORD_WEBHOOK }}
          DRY: ${{ inputs.dry }}
        run: |
          if [ "$DRY" = "true" ]; then
            node tools/radar.mjs --dry
          else
            node tools/radar.mjs
          fi
