name: Labels

# Keeps the repository's labels equal to .github/labels.json. tools/sync-labels.mjs says why.

on:
  push:
    branches: [main]
    paths: ['.github/labels.json']
  workflow_dispatch:

# The token reads the repository and nothing more. The job that edits labels asks for that itself.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # labels are issue metadata, so this needs issues: write and nothing else
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Make the labels match the file
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/sync-labels.mjs
