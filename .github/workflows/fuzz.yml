# Once a week, libFuzzer throws a few minutes of inputs at each parser that reads other people's
# files: a VPK's directory, a mod archive, a compiled resource and its KV3, text KeyValues, a
# texture (fuzz/fuzz_targets). It follows the code each input reaches, so it digs into the
# branches a hand-written generator never thinks of. A crash is a file in the run's artifacts:
# add it to the parser's tests before fixing the parser. Like the mutants, it is a report, not a
# check that blocks.
name: Fuzz

on:
  schedule:
    - cron: '43 5 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz the parsers of other people's files
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # libFuzzer's instrumentation is nightly-only
      - name: Rust toolchain
        run: rustup toolchain install stable nightly --profile minimal && rustup default nightly
      # the tool itself on stable: its pinned dependencies need not build on today's nightly
      # (cargo-fuzz 0.12.0's rustix did not, 2026-11-16)
      - name: cargo-fuzz
        run: cargo +stable install cargo-fuzz --version 0.13.2 --locked
      - name: Five minutes on each parser
        working-directory: fuzz
        run: |
          status=0
          for t in vpk zip resource kv vtex; do
            echo "::group::$t"
            cargo fuzz run "$t" -- -max_total_time=300 -rss_limit_mb=2048 || status=1
            echo "::endgroup::"
          done
          exit $status
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz/artifacts
          if-no-files-found: ignore
