# Unit tests for the parts that touch the player's game files: the search-path patch, the VPK
# reader/writer, language-folder detection and the item schema. A regression in any of them is
# invisible until someone's game stops working, so they run on every push.
name: Tests

on:
  # Pull requests get the quick checks; the merge queue runs everything once, on top of the newest
  # main, and main is then that very commit, so a push to main does not run them a third time.
  pull_request:
  merge_group:
  workflow_dispatch:


permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Node 24 for the test runner: the tests use zlib.crc32 (Node 22+). Nothing under test/ or
      # tools/ is packaged into the app - the shell embeds the built page and preload.js - so this
      # cannot drift into runtime code.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      # This used to skip installing on the grounds that the modules under test were
      # dependency-free. That stopped being true once the tests reached the installer and the
      # toolchain, which pull in adm-zip, and every run since has failed on a missing module
      # while a developer's machine passed because node_modules was already there.
      - name: Install dependencies
        run: npm ci

      # the runner image carries rustup; stable is whatever it names today
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # the tests that hold the app's answers to the Rust core run mm-cli, and fail under CI
      # when it is missing instead of skipping (test/helpers/mm-cli.ts)
      # the target folder rust-cache.yml built on main: a pull request rebuilds only what it
      # changed instead of every crate from scratch.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: debug
          save-if: false
      - name: Build mm-cli
        run: cargo build -p mm-cli

      # The workflows, read the way GitHub reads them.
      #
      # test/workflows.test.js reads these files as text. On 2026-09-26 release.yml reached main
      # with two lines at column zero inside a run block: every test passed, GitHub could not read
      # the file, and the next tag would have started no release. actionlint parses each workflow,
      # checks every expression, `needs` and output against the jobs that exist, and hands each run
      # block to shellcheck, held to errors only: a script that cannot run, not a style note.
      #
      # A binary rather than an action, pinned by version and by the SHA-256 in the release's own
      # checksums file, so a change upstream cannot run here without a pull request saying so.
      - name: Check the workflows with actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_OPTS: --severity=error
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

      # A name that is not there is not something a test can see.
      #
      # Splitting registerIpc on 2026-09-06 moved a call into one file and left the function it
      # called in another. Every test passed - the contract test reads these files as text, and
      # the unit tests never load a module that needs Electron - and two releases shipped in
      # which no mod could be installed at all. The same split left a second one in
      # ipc-presets.js that nobody had hit yet.
      #
      # `no-undef` names both in under a second. It runs before the suite because when it fails
      # there is no point reading anything below it.
      # `npm run verify` is the command a person runs before pushing: lint, the type check, the suite.
      - name: Lint, types, then the suite
        run: npm run verify

  # The same suite on the operating system most of these users are actually on. Issue #5.
  #
  # A separate job rather than a matrix on the one above, because the branch ruleset requires a
  # status check named exactly `test`, and a matrix renames it to `test (ubuntu-latest)`. The
  # gate would then wait forever for a check that no longer exists.
  #
  # This job is here to catch what only breaks on Windows: a path separator,
  # a case-insensitive filesystem, a locked file.
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # the same stable rust-cache.yml warmed the cache with: rustc's version is part of the
      # cache key, and the image's own older Rust never found it (every crate built from scratch)
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable

      # the tests that hold the app's answers to the Rust core run mm-cli, and fail under CI
      # when it is missing instead of skipping (test/helpers/mm-cli.ts)
      # the target folder rust-cache.yml built on main: a pull request rebuilds only what it
      # changed instead of every crate from scratch.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: debug
          save-if: false
      - name: Build mm-cli
        run: cargo build -p mm-cli

      # the Tauri shell, which nothing else compiles before the merge queue: a change to mm-core
      # that breaks it would pass every check here and fail only in the queue. Clippy needs the
      # page's folder to exist, not the page, so an empty one stands in for the UI build.
      # the shell is Windows-only in what it holds (WebView2's switches, the uninstaller), so its tests run here
      - name: Clippy and tests on the shell
        shell: bash
        run: mkdir -p out/renderer-tauri && cargo clippy -p dota2-mod-manager --all-targets -- -D warnings && cargo test -p dota2-mod-manager

      - name: Run tests
        run: npm test
