name: Simulation

# A hand on the app, on simulated machines (tools/sim): every screen and renderer in
# tools/sim/profiles.json, every night and on demand. The report and every picture are uploaded
# whether it passed or not, because the picture of a pass is what a failure next week gets
# compared with.
#
# Not on pull requests or on main since 2026-11-05. It ran on every one, and of 60 commits on main
# from 2026-11-03, 17 went red here and almost all for timing on a busy runner, not for the app,
# while it never blocked a merge. A red cross on every other commit taught everybody to ignore it.
# At night a failed scenario gets a second launch (--retry), a failure that holds shows on the
# pinned "Project status" issue (tools/radar.mjs reads a scheduled workflow's last run), and
# `gh workflow run sim.yml -f set=pr` runs the short set on demand before a risky merge.
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      set:
        description: 'Which set of machines: pr or full'
        default: full

permissions:
  contents: read

concurrency:
  group: sim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Simulate on Windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Seed the sandbox
        run: node tools/sandbox.js seed --no-mods
      - name: Run the simulation
        shell: bash
        env:
          SET: ${{ inputs.set || 'full' }}
        run: node tools/sim/run.mjs --set "$SET" --retry
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: simulation-windows
          path: e2e-output/sim
          if-no-files-found: warn

  linux:
    name: Simulate on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Electron needs an X server a runner does not have; xvfb-run gives each machine its own
      # screen of the profile's size (tools/sim/run.mjs).
      - name: Install xvfb
        # A mirror that stops answering held this step for two hours on 2026-10-01. apt drops a
        # silent connection after 30 s and tries another, and the step gives up at ten minutes.
        timeout-minutes: 10
        # The Ubuntu image ships xvfb (actions/runner-images, Ubuntu 24.04), so apt runs only when it is
        # missing. On 2026-10-07 two runs spent their ten minutes waiting on azure.archive.ubuntu.com
        # for a package that was already installed.
        run: |
          if command -v Xvfb >/dev/null && command -v xvfb-run >/dev/null; then
            echo "xvfb is already on the runner"
          else
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 install -y xvfb
          fi
      - name: Seed the sandbox
        run: node tools/sandbox.js seed --no-mods
      - name: Run the simulation
        env:
          SET: ${{ inputs.set || 'full' }}
        run: node tools/sim/run.mjs --set "$SET" --retry
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: simulation-linux
          path: e2e-output/sim
          if-no-files-found: warn
