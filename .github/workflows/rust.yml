# The Rust crates on their own: their tests, clippy and fmt. The Tauri shell they build into is
# clicked through by e2e.yml (Windows and Linux) in the merge queue.
name: Rust

on:
  # Pull requests get the quick checks; the merge queue runs everything once, on top of the newest
  # main, and main is then that very commit, so a push to main does not run them a third time.
  pull_request:
  merge_group:
  workflow_dispatch:


permissions:
  contents: read

jobs:
  crates:
    name: Rust crates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      # the runner image carries rustup; stable is whatever it names today
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal -c clippy -c rustfmt && rustup default stable
      # the target folder rust-cache.yml built on main: a pull request rebuilds only what it
      # changed instead of every crate from scratch.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: debug
          save-if: false
      - name: Crate tests
        run: cargo fmt --all -- --check && cargo test -p mm-core -p mm-cli
      # the tests too: code that only a test reads is still code someone copies
      - name: Clippy
        run: cargo clippy -p mm-core -p mm-cli --all-targets -- -D warnings
