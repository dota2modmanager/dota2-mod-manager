# The Rust crates on their own: their tests, clippy and fmt. The parity tests that hold them to
# the TypeScript they replace (docs/rust-migration.md) run in test.yml with the rest of the suite.
# The Tauri shell they build into is clicked through by the required checks: e2e.yml (Windows
# and Linux) and linux.yml (the AppImage).
name: Rust

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crates:
    name: Rust crates and parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      # the runner image carries rustup; stable is whatever it names today
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal -c clippy -c rustfmt && rustup default stable
      # the target folder from the last build on main: a pull request rebuilds only what it changed
      # instead of every crate from scratch. Saved from main alone, read everywhere else.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Crate tests
        run: cargo fmt --all -- --check && cargo test -p mm-core -p mm-cli
      - name: Clippy
        run: cargo clippy -p mm-core -p mm-cli -- -D warnings
