name: SEO report

# Once a week, what the search engines are seeing and how far the app reaches, as a comment on
# one tracking issue: https://github.com/dota2modmanager/dota2-mod-manager/issues/3
#
# An issue rather than a file: it arrives by notification, it keeps its own history, and a week
# that went badly can be replied to. One issue with a comment per week rather than a new issue
# each time, so the whole run of them reads top to bottom. It is also the page a reviewer is
# pointed at to see the project's reach, so it opens with that.
#
# Nothing here is read without a key. A console whose secret is missing still gets its heading
# and a line saying which secret it wants, which is better than a workflow that quietly does
# nothing for a month.

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays, 06:00 UTC
  workflow_dispatch:
    inputs:
      raw:
        description: 'Print one endpoint raw instead of posting a report: GetCrawlStats, google:sites, google:country, google:inspect, yandex:user'
        required: false
        default: ''
      dry:
        description: 'Build the whole report and print it, but post nothing'
        type: boolean
        default: false

# The token reads the repository and nothing more. The job that posts the report asks for that itself.
permissions:
  contents: read

concurrency:
  group: seo-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Reading the repository and writing one comment. It used to ask for contents: write, from the
    # days when the state was pushed back as a commit; nothing is pushed any more.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      # Answering "what does this endpoint really return" without anybody pasting the key into
      # a terminal. The key already lives here as a secret; a shell history is a worse place
      # for it. The method name goes through the environment rather than into the command,
      # because a dispatch input interpolated straight into a shell is an injection waiting to
      # be found.
      - name: Print one endpoint raw
        if: inputs.raw != ''
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
          RAW: ${{ inputs.raw }}
        run: node tools/seo-report.mjs --raw "$RAW"

      # Find the issue by listing and matching exactly, not with --search: GitHub's search index
      # is eventually consistent, so an issue created seconds ago is not findable yet, and the
      # first run would create a second one on every attempt.
      - name: Find the tracking issue
        id: issue
        if: inputs.raw == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq 'map(select(.title == "Search visibility")) | first | .number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "tracking issue: ${number:-none yet}"

      # Last week's numbers live at the end of last week's comment (tools/seo-state.mjs says
      # why). They used to be saved to the Actions cache by a step that had no matching restore,
      # so every report for a month said "first week" - and a restore would not have helped,
      # because GitHub evicts a cache nobody touched for seven days, which is exactly the gap
      # between two runs. Only this workflow's own reports are read, never anybody's reply.
      - name: Read last week's report
        if: inputs.raw == '' && steps.issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments?per_page=100" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("## Search, week of")) | .id' | tail -1)
          if [ -n "$id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$id" --jq '.body' > seo-previous.md
            echo "comparing against comment $id"
          else
            : > seo-previous.md
            echo "no earlier report to compare against"
          fi

      # The report is echoed into the log as well as posted, so a run that goes wrong can be
      # read here. Nothing secret reaches it: the keys are never printed, including in errors.
      - name: Read the consoles
        if: inputs.raw == ''
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          SEO_PREVIOUS: seo-previous.md
        run: |
          node tools/seo-report.mjs
          cat seo-report.md

      # `gh issue create` prints the new issue's URL and takes no --json, so the number comes
      # off the end of that URL.
      - name: Post it on the tracking issue
        if: inputs.raw == '' && !inputs.dry
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          number="$NUMBER"
          if [ -z "$number" ]; then
            url=$(gh issue create --title "Search visibility" \
              --body "Weekly reports from the webmaster consoles land here, posted by .github/workflows/seo.yml. Each comment is one week.")
            number="${url##*/}"
            echo "created issue #$number"
          fi
          gh issue comment "$number" --body-file seo-report.md
          echo "posted to issue #$number"
