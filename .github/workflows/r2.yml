# The archives, kept somewhere that is not GitHub.
#
# The catalog and the fingerprint map already have a second home on the site. The mods
# themselves are gigabytes, so they go to R2, where storage is free up to ten of them and
# nobody charges for reading them back out.
#
# Nightly, because the catalog grows on its own schedule and a day-old mirror is a mirror.
# Manual, because the first run and every "did that work" after it happens by hand.
name: R2 mirror

on:
  schedule:
    - cron: '40 3 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many archives to copy this run (blank means as many as fit)'
        required: false
        default: ''
      dry:
        description: 'Say what it would do and touch nothing'
        type: boolean
        default: false
      release:
        description: 'Also publish this release version to updates/ (e.g. 2.6.4), blank to skip'
        required: false
        default: ''

concurrency:
  group: r2-mirror
  cancel-in-progress: false

# The token reads the repository and nothing more. A job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      # The sync itself needs nothing but Node. The toolchain step below reaches into
      # src/toolchain.js, which unpacks a zip through src/safe-zip.ts, which needs adm-zip -
      # so without this the run copied every archive and then went red on its last step. It
      # had been failing that way since the step was added, and a job that always fails is a
      # job nobody reads: that is how the bucket went a night without anybody noticing.
      - name: Install what the toolchain step needs
        run: npm ci --omit=dev --ignore-scripts

      - name: Copy what is missing
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Replacing an object does not replace what the cache in front of it already handed
          # out, and .zip and .vpk are cached by default, so replaced objects are purged. The zone
          # id is an identifier, not a secret, and lives here: kept as a secret, nobody ever set
          # it, and the purge never once ran. The token is the one the site deploys with, which
          # needs Zone, Cache Purge on this zone as well. A purge that is skipped or refused
          # turns the job red instead of printing a line.
          CLOUDFLARE_ZONE_ID: b1b7154350d99e0812859bbc6d775806
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LIMIT: ${{ inputs.limit }}
          DRY: ${{ inputs.dry }}
        run: |
          set -euo pipefail
          argv=""
          [ -n "${LIMIT:-}" ] && argv="--limit $LIMIT"
          [ "${DRY:-false}" = "true" ] && argv="$argv --dry"
          node tools/r2-sync.mjs $argv

      # The pinned toolchain, so the one feature that needs a 50 MB download from somebody
      # else's GitHub release keeps working when GitHub is the thing that is down. Cheap: it
      # only moves bytes when a pin changes.
      - name: Copy the pinned toolchain
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node tools/r2-toolchain.mjs

      # Normally the release workflow does this as part of publishing. Here by hand for the
      # first fill, and for the day a release went out while the bucket was unreachable.
      - name: Publish a release to the update mirror
        if: inputs.release != ''
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node tools/r2-release.mjs '${{ inputs.release }}'
