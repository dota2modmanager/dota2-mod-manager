# The installer and the portable exe, signed with Authenticode through SignPath Foundation.
#
# Windows SmartScreen says "unknown publisher" about an unsigned exe, and antivirus heuristics
# weigh the same thing. SignPath signs open-source projects for free, but only what a GitHub
# workflow built and kept as a workflow artifact: it fetches the artifact from GitHub itself, so a
# file that left the runner some other way cannot be signed (docs/code-signing-policy.md).
#
# The artifact is a zip with the two exes at its root, the shape the project's default artifact
# configuration in SignPath expects. The signed copies replace the ones in `dir`. Authenticode
# changes the bytes, so whatever was signed or hashed from them before (the updater's .sig,
# latest.yml, portable.yml) has to be made again afterwards; the caller does that.
name: Sign with SignPath
description: Authenticode-sign Dota-2-Mod-Manager-Setup.exe and -Portable.exe in a folder through SignPath
inputs:
  api-token:
    description: The SignPath CI user's API token (SIGNPATH_API_TOKEN)
    required: true
  signing-policy:
    description: test-signing (the self-signed test certificate) or release-signing
    required: true
  dir:
    description: The folder holding the two exes, replaced in place by the signed ones
    required: true
runs:
  using: composite
  steps:
    - name: Keep the unsigned exes as a workflow artifact
      id: unsigned
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: unsigned-windows-${{ github.run_attempt }}
        path: |
          ${{ inputs.dir }}/Dota-2-Mod-Manager-Setup.exe
          ${{ inputs.dir }}/Dota-2-Mod-Manager-Portable.exe
        if-no-files-found: error
        retention-days: 1

    - name: Ask SignPath to sign them and wait for the signed copies
      uses: signpath/github-action-submit-signing-request@4a84eb4ad763290f059275786f2deed97c2c672b # v3.1
      with:
        api-token: ${{ inputs.api-token }}
        organization-id: 90ffc887-1eaf-4f95-bffe-781a5fc0ce7f
        project-slug: dota2-mod-manager
        signing-policy-slug: ${{ inputs.signing-policy }}
        github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
        wait-for-completion: true
        output-artifact-directory: ${{ runner.temp }}/signpath-signed

    # Checked before anything is copied over: a signing request that came back with the files
    # unchanged, or with one missing, stops here rather than shipping unsigned under a signed name.
    # The test certificate is self-signed, so its chain is not trusted (Status UnknownError); the
    # release certificate's must be (Valid).
    - name: Check both came back signed and put them in place
      shell: pwsh
      env:
        DIR: ${{ inputs.dir }}
        SIGNED: ${{ runner.temp }}/signpath-signed
        POLICY: ${{ inputs.signing-policy }}
      run: |
        $ErrorActionPreference = 'Stop'
        foreach ($name in 'Dota-2-Mod-Manager-Setup.exe', 'Dota-2-Mod-Manager-Portable.exe') {
          $file = Join-Path $env:SIGNED $name
          if (-not (Test-Path $file)) { throw "SignPath sent back no $name" }
          $sig = Get-AuthenticodeSignature $file
          if (-not $sig.SignerCertificate) { throw "$name came back without an Authenticode signature" }
          if ($env:POLICY -eq 'release-signing' -and $sig.Status -ne 'Valid') { throw "$name is signed, but Windows does not trust it: $($sig.Status) $($sig.StatusMessage)" }
          Write-Host "$name signed by $($sig.SignerCertificate.Subject), status $($sig.Status)"
          Copy-Item $file (Join-Path $env:DIR $name) -Force
        }
