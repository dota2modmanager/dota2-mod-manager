# Ubuntu packages for a job, with the downloaded .deb files kept in the Actions cache.
#
# On 2026-11-18 the runners' Ubuntu mirror sent each file in seconds rather than milliseconds, and
# four AppImage builds in a row ran out of their ten minutes in the middle of downloading WebKitGTK.
# A mirror that trickles never trips apt's timeout, so retrying does not help; not asking it does.
# The cache key changes once a month, so packages Ubuntu updated since are the only ones fetched.
# The calling step sets timeout-minutes (a composite action's own steps cannot).
name: Linux libraries
description: apt-get install, with the downloaded packages cached between runs
inputs:
  packages:
    description: Space-separated Ubuntu package names
    required: true
runs:
  using: composite
  steps:
    - id: month
      shell: bash
      run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/apt-archives
        key: apt-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.month.outputs.month }}
        restore-keys: |
          apt-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
          apt-${{ runner.os }}-${{ runner.arch }}-
    - shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        mkdir -p ~/apt-archives/partial
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
        # shellcheck disable=SC2086
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
          -o Dir::Cache::Archives="$HOME/apt-archives" install -y $PACKAGES
        # apt leaves its download folder to root and _apt, which the cache could not read back
        sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
        sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
