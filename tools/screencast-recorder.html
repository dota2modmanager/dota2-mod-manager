<!doctype html>
<meta charset="utf-8">
<title>screencast recorder</title>
<!--
  A hidden window whose only job is to record another window of this same app.

  It lives apart from the app's own renderer on purpose. Recording needs Node (to write the
  file) and an unlocked page (to hold a MediaStream), and the app's renderer has neither and
  should not get either. Nothing here is shipped: src/dev-harness.ts only loads this when MM_REC is set.
-->
<body style="background:#111;color:#ccc;font:12px system-ui">recorder</body>
<script>
  const fs = require('fs');

  let rec = null;
  let chunks = [];
  let stream = null;

  /**
   * Start recording the window with the given media source id.
   *
   * The constraints are the old `mandatory` form rather than the modern one because that is
   * the only shape Chromium accepts for a desktop source id. Width and height are pinned to
   * the window's own size so the frame is captured 1:1 and nothing gets rescaled twice.
   */
  window.startRec = async (sourceId, w, h, bitrate) => {
    chunks = [];
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        mandatory: {
          chromeMediaSource: 'desktop',
          chromeMediaSourceId: sourceId,
          minWidth: w, maxWidth: w,
          minHeight: h, maxHeight: h,
          maxFrameRate: 24,
        },
      },
    });
    // VP8 rather than VP9 on purpose. Asked for VP9 on a screen-capture track, Chromium
    // encodes at its own quality target and ignores the bitrate entirely: an eighteen second
    // clip came out at 12.9 MB against a 1.4 Mbit ceiling. VP8 honours the number. The file is
    // a little larger at the same quality than VP9 would be if VP9 obeyed, and a file that
    // obeys beats a file that does not.
    rec = new MediaRecorder(stream, {
      mimeType: 'video/webm;codecs=vp8',
      videoBitsPerSecond: bitrate,
      bitsPerSecond: bitrate,
    });
    rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.start(250);
    return 'recording';
  };

  window.stopRec = (outPath) => new Promise((resolve, reject) => {
    if (!rec) { resolve('nothing to stop'); return; }
    rec.onstop = async () => {
      try {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const buf = Buffer.from(await blob.arrayBuffer());
        fs.writeFileSync(outPath, buf);
        stream.getTracks().forEach((t) => t.stop());
        rec = null; stream = null; chunks = [];
        resolve({ bytes: buf.length });
      } catch (e) { reject(String(e)); }
    };
    rec.stop();
  });
</script>
